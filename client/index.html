    <!-- WebSocket fix voor Vite HMR -->
    <script>
      (function() {
        const originalWebSocket = window.WebSocket;
        const originalConsoleError = console.error;
        
        // Onderdruk Vite WebSocket errors
        console.error = function(...args) {
          const message = args.join(' ');
          if (message.includes('[vite] failed to connect to websocket')) {
            return; // Stille onderdrukking
          }
          originalConsoleError.apply(console, args);
        };
        
        window.WebSocket = function(url, protocols) {
          // Fix undefined poort in WebSocket URL
          if (url && url.includes(':undefined')) {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            url = url.replace(/wss?:\/\/localhost:undefined/, wsProtocol + '//' + window.location.host);
          }
          return new originalWebSocket(url, protocols);
        };
        
        window.WebSocket.prototype = originalWebSocket.prototype;
        Object.setPrototypeOf(window.WebSocket, originalWebSocket);
      })();
    </script>
